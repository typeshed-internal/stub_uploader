[project]
name = "stub-uploader"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    # scripts
    "packaging==26.2", # see issue #220, needs investigation
    "requests>=2.34.2",

    # build and upload
    "build>=1.6.0",
    "setuptools>=82.0.1",
    "twine>=7.0.0",
    "wheel>=0.48.0",

    # tests
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-requests>=2.33.0.20260712",
]

[tool.uv]
# Manage script dependencies without building or installing this repository.
package = false
# For improved security, avoid executing third-party build backends when installing
# dependencies.
no-build = true
# Allow time for security issues in new releases to be discovered by security scanners.
exclude-newer = "P7D"
